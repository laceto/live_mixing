[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live_mixing"
version = "0.1.0"
description = "Read, join, and export data from a DJUCED DJ software SQLite database"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "mypy", "ruff"]
# live_mixing/search.py — hybrid BM25+semantic track search. Not required
# for the pandas-only core; kitai isn't on PyPI so it's pulled via git.
search = [
    "openai>=1.0",
    "numpy>=1.23",
    "pydantic>=2.0",
    "langchain-core>=0.1",
    "langchain-community>=0.0.20",
    "langchain>=0.1,<1.0",
    "faiss-cpu>=1.7",
    "kitai @ git+https://github.com/laceto/kitai.git",
]

[tool.setuptools.packages.find]
include = ["live_mixing*"]
